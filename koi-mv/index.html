<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>

    <symbol id="heart-sym" viewBox="0 0 340 320">
      <g clip-path="url(#heart-clip)">
        <rect width="340" height="320" fill="#d84860"/>
        <path transform="translate(-6 -10) scale(0.985 0.955)" fill="#fc6078" d="M170 312C120 296 18 232 12 142C6 62 60 16 112 20C142 22 162 44 170 68C178 44 198 22 228 20C280 16 334 62 328 142C322 232 220 296 170 312Z"/>
        <path fill="#f0607a" opacity=".55" d="M170 68C178 44 198 22 228 20C262 18 300 38 316 80C288 62 252 58 222 76C200 90 186 104 176 124Z"/>
        <ellipse cx="96" cy="82" rx="46" ry="27" transform="rotate(-32 96 82)" fill="#f4b8cb"/>
        <ellipse cx="84" cy="74" rx="15" ry="8" transform="rotate(-32 84 74)" fill="#fff" opacity=".85"/>
        <ellipse cx="246" cy="66" rx="24" ry="12" transform="rotate(18 246 66)" fill="#f4b8cb"/>
      </g>
      <path fill="none" stroke="#2b1319" stroke-width="3.6" stroke-linejoin="round" d="M170 312C120 296 18 232 12 142C6 62 60 16 112 20C142 22 162 44 170 68C178 44 198 22 228 20C280 16 334 62 328 142C322 232 220 296 170 312Z"/>
    </symbol>
    <symbol id="i-heart" viewBox="0 0 36 36"><path d="M18 31C10 25 3 19 3 12.5 3 8 6.6 5 10.6 5c3 0 5.6 1.8 7.4 4.4C19.8 6.8 22.4 5 25.4 5 29.4 5 33 8 33 12.5 33 19 26 25 18 31Z"/></symbol>
    <symbol id="i-broken" viewBox="0 0 36 36"><path fill="none" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round" d="M18 31C10 25 3 19 3 12.5 3 8 6.6 5 10.6 5c3 0 5.6 1.8 7.4 4.4C19.8 6.8 22.4 5 25.4 5 29.4 5 33 8 33 12.5 33 19 26 25 18 31Z M18 9.4 15 16l5 3.2-3.4 6.8"/></symbol>
    <symbol id="i-tear" viewBox="0 0 36 36"><path fill="none" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round" d="M18 4C18 4 8 16 8 22.5a10 10 0 0 0 20 0C28 16 18 4 18 4Z"/></symbol>
    <symbol id="i-phone" viewBox="0 0 36 36"><path fill="none" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round" d="M9 4.5l5.2 1.2 2.2 6.4-3.4 2.6c1.8 3.8 4.4 6.4 8.2 8.2l2.6-3.4 6.4 2.2 1.2 5.2c-1 2.6-3.6 4.2-6.6 3.8C13.4 29.5 6.5 22.6 5.2 11.2 4.8 8.2 6.4 5.6 9 4.5Z"/></symbol>
    <symbol id="i-mail" viewBox="0 0 36 36"><rect x="4" y="9" width="28" height="20" rx="3" fill="none" stroke="currentColor" stroke-width="3.2"/></symbol>
  </defs>
</svg>

<div id="stage">
  <div id="scene" class="layer">
    <div id="far" class="layer"></div>
    <div id="mid" class="layer"><svg id="mid-svg" class="abs" width="1" height="1"></svg></div>
    <svg id="fx-back" class="abs" width="1920" height="1080"></svg>
    <div id="actor" class="layer">
      <div id="girl" class="sprite"><img id="g-hug" src="assets/girl.png" alt=""><img id="g-empty" src="assets/girl_empty.png" alt=""></div>
      <svg id="heart" class="heart" viewBox="0 0 340 320"><use href="#heart-sym"/></svg>
      <div id="clip-wrap"><video id="clip" muted playsinline preload="auto"></video></div>
      <div id="girl-front" class="sprite"><img src="assets/girl_sleeve.png" alt=""></div>
    </div>
    <div id="near" class="layer"></div>
    <svg id="fx" class="abs" width="1920" height="1080"></svg>
    <div id="hud" class="layer"></div>
    <div id="lyrics" class="layer"></div>
    <div id="top" class="layer"></div>
  </div>
  <div id="endcard" class="layer"></div>
  <svg id="sweep" class="heart" viewBox="0 0 340 320"><use href="#heart-sym"/></svg>
  <canvas id="grain" class="layer" width="960" height="540"></canvas>
</div>

<div id="ui"><div id="play"><svg viewBox="0 0 22 22"><path d="M5 3l14 8-14 8Z" fill="currentColor"/></svg><span>PLAY</span></div></div>

<script>document.write('<script src="clips/' + (new URLSearchParams(location.search).get("clip") || "kling15") + '.js" onerror="this.remove()"><\/script>');</script>
<script src="js/audio.js"></script>
<script src="js/typo.js"></script>
<script src="js/kinetic.js"></script>
<script src="js/mv.js"></script>
</body>
</html>
